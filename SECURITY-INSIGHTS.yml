header:
  schema-version: 2.2.0
  last-updated: '2026-09-23'
  last-reviewed: '2026-09-23'
  url: https://gitlab.com/bart-turczynski/seor/-/raw/main/SECURITY-INSIGHTS.yml
  comment: |
    OpenSSF Security Insights self-report. Maintained alongside SECURITY.md
    (human-readable policy) and .bestpractices.json (OpenSSF Best Practices
    badge self-assessment). Refresh both header dates whenever anything below
    is re-measured, not only when it changes -- a self-report that claims a
    review date it never had is the failure mode this file exists to avoid.

project:
  name: seor
  homepage: https://seor-272402.gitlab.io/
  administrators:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      primary: true
  documentation:
    quickstart-guide: https://seor-272402.gitlab.io/
    detailed-guide: https://seor-272402.gitlab.io/reference/index.html
    release-process: https://gitlab.com/bart-turczynski/seor/-/blob/main/CONTRIBUTING.md
  repositories:
    - name: seor
      url: https://gitlab.com/bart-turczynski/seor
      comment: |
        Sole repository for the seor package.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Bart Turczynski
      email: bartek@turczynski.pl
      primary: true
    policy: https://gitlab.com/bart-turczynski/seor/-/blob/main/SECURITY.md
    comment: |
      Please do not report vulnerabilities through public GitLab issues. Open
      a **confidential** issue instead (tick "This issue is confidential" when
      creating it), or email the maintainer. GitLab Free has no equivalent to
      GitHub private vulnerability reporting; a confidential issue is the
      closest supported channel.

repository:
  url: https://gitlab.com/bart-turczynski/seor
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: false
  no-third-party-packages: false
  core-team:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      primary: true
  documentation:
    contributing-guide: https://gitlab.com/bart-turczynski/seor/-/blob/main/CONTRIBUTING.md
    security-policy: https://gitlab.com/bart-turczynski/seor/-/blob/main/SECURITY.md
  license:
    url: https://gitlab.com/bart-turczynski/seor/-/blob/main/LICENSE
    expression: MIT
  release:
    changelog: https://gitlab.com/bart-turczynski/seor/-/blob/main/NEWS.md
    automated-pipeline: false
    distribution-points:
      - uri: https://CRAN.R-project.org/package=seor
        comment: Canonical release channel (CRAN).
      - uri: https://gitlab.com/bart-turczynski/seor/-/releases
        comment: Tagged GitLab Releases mirroring each CRAN version.
  security:
    tools:
      - name: rosv (OSV)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          The osv-audit job in .gitlab-ci.yml audits the runtime dependency
          closure against the OSV database (osv.dev). No account or secrets
          required.

          It has no automatic trigger. The job extends .scheduled-or-manual,
          and this project has no pipeline schedules at all (measured
          2026-09-23: pipeline_schedules returns []), so it runs only when a
          pipeline is started by hand from the web UI. It is excluded from
          .on-mr-and-main, so it does not run on a merge request or a push to
          the default branch either. Creating the schedule is an owner action,
          tracked as SEOR-tzxuisnf; the cadence it will take is decided in
          SEOR-ihmntqzm. This comment states the trigger the job actually has
          and must be updated in the same change that gives it a schedule.
      - name: oysteR (Sonatype OSS Index)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          The security-audit job in .gitlab-ci.yml audits declared dependencies
          against the Sonatype OSS Index.

          It has no automatic trigger, for the same reason as osv-audit above:
          .scheduled-or-manual plus no pipeline schedules means hand-started
          web pipelines only. It additionally needs the OSSINDEX_USER and
          OSSINDEX_TOKEN CI/CD variables, which do not exist yet, so a
          scheduled run would be red until an owner supplies them
          (SEOR-tzxuisnf). seor's pre-push gate does not reach this audit
          either: it runs rcmdcheck under rcmd_safe_env(), so skip_on_cran()
          fires first.
