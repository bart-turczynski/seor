header:
  schema-version: 2.2.0
  last-updated: '2026-09-30'
  last-reviewed: '2026-09-30'
  url: https://gitlab.com/bart-turczynski/seor/-/raw/main/SECURITY-INSIGHTS.yml
  comment: |
    OpenSSF Security Insights self-report. Maintained alongside SECURITY.md
    (human-readable policy) and .bestpractices.json (OpenSSF Best Practices
    badge self-assessment). Refresh both header dates whenever anything below
    is re-measured, not only when it changes -- a self-report that claims a
    review date it never had is the failure mode this file exists to avoid.

project:
  name: seor
  homepage: https://bart-turczynski.gitlab.io/seor/
  administrators:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      primary: true
  documentation:
    quickstart-guide: https://bart-turczynski.gitlab.io/seor/
    detailed-guide: https://bart-turczynski.gitlab.io/seor/reference/index.html
    release-process: https://gitlab.com/bart-turczynski/seor/-/blob/main/design/release-deltas.md
  repositories:
    - name: seor
      url: https://gitlab.com/bart-turczynski/seor
      comment: |
        Sole repository for the seor package.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Bart Turczynski
      email: bartek@turczynski.pl
      primary: true
    policy: https://gitlab.com/bart-turczynski/seor/-/blob/main/SECURITY.md
    comment: |
      Please do not report vulnerabilities through public GitLab issues. Open
      a **confidential** issue instead (tick "This issue is confidential" when
      creating it), or email the maintainer. GitLab Free has no equivalent to
      GitHub private vulnerability reporting; a confidential issue is the
      closest supported channel.

repository:
  url: https://gitlab.com/bart-turczynski/seor
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: false
  no-third-party-packages: false
  core-team:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      primary: true
  documentation:
    contributing-guide: https://gitlab.com/bart-turczynski/seor/-/blob/main/CONTRIBUTING.md
    security-policy: https://gitlab.com/bart-turczynski/seor/-/blob/main/SECURITY.md
  license:
    url: https://gitlab.com/bart-turczynski/seor/-/blob/main/LICENSE
    expression: MIT
  release:
    changelog: https://gitlab.com/bart-turczynski/seor/-/blob/main/NEWS.md
    automated-pipeline: false
    distribution-points:
      - uri: https://CRAN.R-project.org/package=seor
        comment: Canonical release channel (CRAN).
      - uri: https://gitlab.com/bart-turczynski/seor/-/releases
        comment: Tagged GitLab Releases mirroring each CRAN version.
  security:
    tools:
      - name: rosv (OSV)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: true
        results: {}
        comment: |
          The osv-audit job (fleet-ci's template, included by .gitlab-ci.yml)
          audits the runtime dependency closure against the OSV database
          (osv.dev) through tests/testthat/test-osv.R. No account or secrets
          required.

          It runs in T2 and T3 (ADR 0012): the weekly deep-check schedule,
          every RELEASE=1 pre-submission web pipeline and every v* tag
          pipeline. It no longer has a schedule of its own; the
          dependency-audit schedule starts no pipeline. The local pre-push
          gate leaves test-osv.R out (.fleet-ci.yml, exclude_tests).
      - name: oysteR (Sonatype OSS Index)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: true
        results: {}
        comment: |
          The security-audit job (fleet-ci's template, included by
          .gitlab-ci.yml) audits declared dependencies against the Sonatype
          OSS Index through tests/testthat/test-security.R.

          It runs where osv-audit runs, in T2 and T3. It additionally needs
          the OSSINDEX_USER (the literal `x`, not the account email) and
          OSSINDEX_TOKEN (a Sonatype Guide personal access token) CI/CD
          variables, and sets OSSINDEX_AUDIT_REQUIRED=true, so it fails
          rather than passing having audited nothing. Both are set on the
          project (listed 2026-09-30; SEOR-ipgxtzca). The local pre-push gate
          leaves test-security.R out (.fleet-ci.yml, exclude_tests). The
          other T2 legs run it with NOT_CRAN=true and the project variables
          in scope, so they call OSS Index too (design/ci.md, "Gaps
          accepted").
