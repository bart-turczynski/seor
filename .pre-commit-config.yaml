# The hygiene hooks and the shared fleet tooling's self-tests, at commit and
# at push. Install with `pre-commit install` (both hook types, from
# default_install_hook_types below), then `.fleet-ci/pre-push --install`,
# which replaces pre-commit's pre-push hook with fleet-ci's: that hook runs
# the fleet-ci local gate (.fleet-ci/gate, settings in .fleet-ci.yml) on each
# pushed ref's tip, then this file's pre-push stage. The gate itself (lintr,
# spelling, docs drift, the URL, README and NEWS-heading checks, the
# citation, BugReports and logo-metadata checks, R CMD check; the former
# `verify`, `docs-drift`, `check-urls`, `spelling`, `check-citation`,
# `check-bugreports` and `logo-metadata-check` hooks and scripts/gates.sh)
# is in .fleet-ci.yml, never here: this file must not run
# .fleet-ci/gate (fleet-ci README, "The local gate").
#
# Over fleet-ci's hook, `pre-commit install` and
# `pre-commit install --hook-type pre-push` without -f move it to
# hooks/pre-push.legacy (pre-commit's migration mode), which still runs the
# gate first. `pre-commit install -f` (both types, from
# default_install_hook_types) and `pre-commit install -f --hook-type pre-push`
# delete it and drop the gate; `-f --hook-type pre-commit` leaves it alone.
# Re-run `.fleet-ci/pre-push --install` after either of the two.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # .fleet-ci/ is fleet-ci's bin/vendor output, which seor's fleet
      # checker requires byte for byte; re-run bin/vendor rather than
      # editing it, so no fixer or formatter touches it.
      - id: end-of-file-fixer
        exclude: '^\.fleet-ci/'
      - id: trailing-whitespace
        exclude: '^\.fleet-ci/'
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        exclude: '^\.fleet-ci/'
      - id: check-case-conflict
  # Air (https://posit-dev.github.io/air/) formats R sources on commit. The
  # hook bootstraps its own R-free binary, so no global install is needed.
  # Air owns layout; the gate's lintr (a cheap gate in .fleet-ci.yml) owns
  # logic lints. Only Air >= 0.8.2 can be pinned as a pre-commit rev. Not
  # .fleet-ci/ (above): Air would reformat the vendored gate-run.R.
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.12.0
    hooks:
      - id: air-format
        exclude: '^\.fleet-ci/'
  # The gate's spelling check (docs_gates in .fleet-ci.yml) reads
  # DESCRIPTION, roxygen, vignettes, README and NEWS, but not code, comments,
  # string literals or tooling. This covers those for British spellings
  # (SEOR-xtmnpmae; design/fleet.md "Prose language"). Skipped: generated man/
  # and docs/, .bestpractices.json (it mirrors the live bestpractices.dev
  # entry), accepted ADRs 0003 and 0005, which scripts/check-design.py keeps
  # immutable, and .fleet-ci/ (bin/vendor's output). The British forms
  # design/fleet.md quotes on purpose carry inline codespell:ignore comments.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US]
        stages: [pre-commit, pre-push]
        exclude: '^(\.fleet-ci/|man/|docs/|\.bestpractices\.json$|design/adr/0003-fleet-ci-runs-on-self-hosted-runners\.md$|design/adr/0005-cheap-ci-jobs-fold-into-one-gates-job\.md$)'
  - repo: local
    hooks:
      - id: check-design
        name: design-doc hygiene
        entry: python3 scripts/check-design.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # check-citation.py (CITATION.cff and .zenodo.json against DESCRIPTION;
      # design/adr/0001-citation-metadata-names-the-release.md) and
      # check-bugreports.py (every tracker link names /-/work_items; ADR 0011)
      # are host_gates in .fleet-ci.yml, so the gate's full tier judges the
      # pushed commit with them; T2's citation-version job runs
      # check-citation.py too. A docs-only push cannot change what either
      # reads. Their offline self-tests run here, when the script changes.
      - id: check-citation-self-test
        name: check-citation self-test
        entry: python3 scripts/check-citation.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-citation\.py$
        stages: [pre-push]
      - id: check-bugreports-self-test
        name: check-bugreports self-test
        entry: python3 scripts/check-bugreports.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-bugreports\.py$
        stages: [pre-push]
      # check-news.py refuses a NEWS.md bullet that wraps, runs past its word
      # limit or names only housekeeping, and any Internal heading
      # (design/fleet-standard.md, "NEWS.md bullets"; SEOR-mjrpwnqz). It is
      # the reference copy members port. The check runs on every push: it
      # takes milliseconds. Its self-test runs when the script changes.
      - id: news-terse
        name: NEWS.md bullets are one terse line
        entry: python3 scripts/check-news.py NEWS.md
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: news-terse-self-test
        name: check-news self-test
        entry: python3 scripts/check-news.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-news\.py$
        stages: [pre-push]
      # bestpractices-url.py is a maintainer tool that reads the network, so the
      # hook runs only its offline self-test, and only when the script changes.
      - id: bestpractices-url-self-test
        name: bestpractices-url self-test
        entry: python3 scripts/bestpractices-url.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/bestpractices-url\.py$
        stages: [pre-push]
      # check-citation-nonr.py is the citation gate for the non-R repositories
      # (package.json or git-tag version sources), vendored from here into
      # them (ADR 0006). seor is an R package and keeps check-citation.py, so
      # only the offline self-test runs here, and only when the script
      # changes. It builds throwaway git repositories, so it needs git on PATH.
      - id: check-citation-nonr-self-test
        name: check-citation-nonr self-test
        entry: python3 scripts/check-citation-nonr.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-citation-nonr\.py$
        stages: [pre-push]
      # logo-metadata.py writes the fleet's logo metadata, keywords copied from
      # DESCRIPTION's X-schema.org-keywords (SEOR-qoqmestu). Its offline
      # self-test runs when the script changes. Its --check, which fails when
      # seor's own logo has drifted from DESCRIPTION (SEOR-zgsfwyjk), is a
      # host_gate in .fleet-ci.yml, so the gate's full tier judges the pushed
      # commit with it.
      - id: logo-metadata-self-test
        name: logo-metadata self-test
        entry: python3 scripts/logo-metadata.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/logo-metadata\.py$
        stages: [pre-push]
      # check-fleet-standard.py tests a fleet package against
      # design/fleet-standard.md and reads GitLab and the web, so the hook runs
      # only its offline self-test, and only when an input of it changes: the
      # script (SEOR-myokihrl); check-toolchain.R, whose reader of the pandoc
      # pin it runs (SEOR-xhyrogfm); logo-metadata.py, whose --check it runs
      # (SEOR-seobtecv), and seor's own logos and DESCRIPTION, which that
      # self-test judges as an anchor; and check-docs-drift.R, the copy members
      # must match (SEOR-lyciowif). It reads .gitlab-ci.yml with PyYAML
      # (ADR 0008), so the hook runs in its own environment with the pinned
      # PyYAML, and `python` is that environment's interpreter.
      - id: check-fleet-standard-self-test
        name: check-fleet-standard self-test
        entry: python scripts/check-fleet-standard.py --self-test
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        pass_filenames: false
        files: ^(scripts/(check-fleet-standard\.py|check-toolchain\.R|logo-metadata\.py|check-docs-drift\.R)|man/figures/logo\.(svg|png)|DESCRIPTION)$
        stages: [pre-push]
        verbose: true
      # Warns, loudly, when this clone's pre-push hook is not fleet-ci's, so
      # the push ran without the gate. Warn-only by decision, time-boxed until
      # the hook is installed fleet-wide, then it fails (SEOR-cjxarlcq). It
      # only reads the hook file; it never runs .fleet-ci/gate.
      - id: fleet-ci-hook-installed
        name: fleet-ci pre-push hook is installed (warn-only)
        entry: sh scripts/check-fleet-hook.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
      # This machine's R toolchain against what the package pins: roxygen2
      # against Config/roxygen2/version, installed packages built under a newer
      # R, and the local pandoc against the fleet image's (.fleet-ci/toolchain),
      # so a local devtools::document() or build_readme() writes what the gate
      # accepts. The gate itself runs in the fleet image and does not depend
      # on this machine's library. Quick: one request, for CRAN's package
      # index, which the check for a dependency older than CRAN's reads
      # (SEOR-hxxxkmws, SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # check-docs-drift.R is the one copy every package vendors
      # (SEOR-lyciowif); the gate runs it on seor itself (a cheap gate in
      # .fleet-ci.yml). Its self-test runs it on throwaway fixture packages
      # (docs missing, changed, stale and in sync, with git on PATH and
      # without), only when the script changes; it takes seconds.
      - id: check-docs-drift-self-test
        name: check-docs-drift self-test
        entry: Rscript scripts/check-docs-drift.R --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-docs-drift\.R$
        stages: [pre-push]
      # check-urls.R's offline classifier test, when the script changes. The
      # live URL check is a cheap gate in .fleet-ci.yml.
      - id: check-urls-self-test
        name: check-urls self-test
        entry: Rscript scripts/check-urls.R --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-urls\.R$
        stages: [pre-push]
