# Overrides the shared config: the shared `verify` hook wraps the command in a
# bash invocation that breaks on R's verify command (it contains the double
# quotes from the rcmdcheck --as-cran argument). Here the R code is passed as a
# single argv element, so no shell quoting is involved.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
      - id: check-case-conflict
  # Air (https://posit-dev.github.io/air/) formats R sources on commit. The
  # hook bootstraps its own R-free binary, so no global install is needed.
  # Air owns layout; the local `verify` lintr gate below owns logic lints.
  # Only Air >= 0.8.2 can be pinned as a pre-commit rev.
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.8.2
    hooks:
      - id: air-format
  # The `spelling` hook below reads DESCRIPTION, roxygen, vignettes, README
  # and NEWS, but not code, comments, string literals or tooling. This covers
  # those for British spellings (SEOR-xtmnpmae; design/fleet.md "Prose
  # language"). Skipped: generated man/ and docs/, .bestpractices.json (it
  # mirrors the live bestpractices.dev entry), and accepted ADRs 0003 and 0005,
  # which scripts/check-design.py keeps immutable. The British forms
  # design/fleet.md quotes on purpose carry inline codespell:ignore comments.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US]
        stages: [pre-commit, pre-push]
        exclude: '^(man/|docs/|\.bestpractices\.json$|design/adr/0003-fleet-ci-runs-on-self-hosted-runners\.md$|design/adr/0005-cheap-ci-jobs-fold-into-one-gates-job\.md$)'
  - repo: local
    hooks:
      - id: check-design
        name: design-doc hygiene
        entry: python3 scripts/check-design.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # CITATION.cff and .zenodo.json duplicate the version and the project
      # URLs out of DESCRIPTION, and nothing asserted either copy. Offline,
      # stdlib-only and instant. The rule it enforces is
      # design/adr/0001-citation-metadata-names-the-release.md.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # DESCRIPTION's BugReports: keeps the /-/issues form CRAN's incoming
      # check string-tests for; every human-facing tracker link (codemeta.json,
      # .bestpractices.json, CONTRIBUTING.md, SECURITY.md) names /-/work_items,
      # and no other human-facing file may carry a /-/issues link
      # (SEOR-ocbtrrnl). Offline, stdlib-only, same shape as check-citation.
      - id: check-bugreports
        name: BugReports split (DESCRIPTION vs human-facing links)
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # bestpractices-url.py is a maintainer tool that reads the network, so the
      # hook runs only its offline self-test, and only when the script changes.
      - id: bestpractices-url-self-test
        name: bestpractices-url self-test
        entry: python3 scripts/bestpractices-url.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/bestpractices-url\.py$
        stages: [pre-push]
      # check-citation-nonr.py is the citation gate for the non-R repositories
      # (package.json or git-tag version sources), vendored from here into
      # them (ADR 0006). seor is an R package and keeps check-citation.py, so
      # only the offline self-test runs here, and only when the script
      # changes. It builds throwaway git repositories, so it needs git on PATH.
      - id: check-citation-nonr-self-test
        name: check-citation-nonr self-test
        entry: python3 scripts/check-citation-nonr.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-citation-nonr\.py$
        stages: [pre-push]
      # seor is a metapackage whose members `pagerankr`, `sitemapr` and `robotstxtr`
      # are not yet on CRAN, so `--as-cran`'s "CRAN incoming feasibility" step always
      # reports an ERROR: non-mainstream strong dependencies, the `Remotes:` field, and
      # the archived `seoR` name clash. That is a true statement about CRAN readiness
      # and a permanent one until the members are published, so running it as a
      # per-push gate encodes a known failure rather than catching a regression. The
      # step is disabled here and only here; every other `--as-cran` check still runs.
      # Re-enable it as part of the first CRAN submission, when `Remotes:` is dropped.
      # Toolchain drift makes the gate red on a tree nobody changed, and it
      # arrives disguised as a code defect: a roxygen2 skew aborts the docs
      # guard, and a package built under a newer R than this one surfaces as an
      # R CMD check WARNING minutes into the expensive step below. This is
      # offline and instant, and it runs ahead of that step so the machine is
      # named as the cause in one line rather than found by elimination
      # (SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # R CMD check skips its DESCRIPTION spelling check on a machine with no
      # English aspell/hunspell dictionary, so a typo first shows up in
      # win-builder's incoming NOTE. spelling bundles its own hunspell
      # dictionaries and also reads man/, vignettes, README and NEWS
      # (SEOR-mtbzfroz). Genuine terms go in inst/WORDLIST.
      - id: spelling
        name: spelling (en-US, inst/WORDLIST)
        entry: Rscript -e
        args:
          - 'bad <- spelling::spell_check_package(); if (nrow(bad)) { print(bad); quit(status = 1) }'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: verify
        name: verify (mirrors CI)
        entry: Rscript -e
        args:
          - 'lints <- lintr::lint_package(); if (length(lints)) { print(lints); quit(status = 1) }; rcmdcheck::rcmdcheck(args = "--as-cran", error_on = "warning", env = c(callr::rcmd_safe_env(), "_R_CHECK_CRAN_INCOMING_" = "false"))'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
