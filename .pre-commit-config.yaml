# Overrides the shared config: the shared `verify` hook wraps the command in a
# bash invocation that breaks on R's verify command (it contains the double
# quotes from the rcmdcheck --as-cran argument). Here the R code is passed as a
# single argv element, so no shell quoting is involved.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
      - id: check-case-conflict
  # Air (https://posit-dev.github.io/air/) formats R sources on commit. The
  # hook bootstraps its own R-free binary, so no global install is needed.
  # Air owns layout; the local `verify` lintr gate below owns logic lints.
  # Only Air >= 0.8.2 can be pinned as a pre-commit rev.
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.8.2
    hooks:
      - id: air-format
  - repo: local
    hooks:
      - id: check-design
        name: design-doc hygiene
        entry: python3 scripts/check-design.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # CITATION.cff and .zenodo.json duplicate the version and the project
      # URLs out of DESCRIPTION, and nothing asserted either copy. Offline,
      # stdlib-only and instant. The rule it enforces is
      # design/adr/0001-citation-metadata-names-the-release.md.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # seor is a metapackage whose members `pagerankr`, `sitemapr` and `robotstxtr`
      # are not yet on CRAN, so `--as-cran`'s "CRAN incoming feasibility" step always
      # reports an ERROR: non-mainstream strong dependencies, the `Remotes:` field, and
      # the archived `seoR` name clash. That is a true statement about CRAN readiness
      # and a permanent one until the members are published, so running it as a
      # per-push gate encodes a known failure rather than catching a regression. The
      # step is disabled here and only here; every other `--as-cran` check still runs.
      # Re-enable it as part of the first CRAN submission, when `Remotes:` is dropped.
      # Toolchain drift makes the gate red on a tree nobody changed, and it
      # arrives disguised as a code defect: a roxygen2 skew aborts the docs
      # guard, and a package built under a newer R than this one surfaces as an
      # R CMD check WARNING minutes into the expensive step below. This is
      # offline and instant, and it runs ahead of that step so the machine is
      # named as the cause in one line rather than found by elimination
      # (SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: verify
        name: verify (mirrors CI)
        entry: Rscript -e
        args:
          - 'lints <- lintr::lint_package(); if (length(lints)) { print(lints); quit(status = 1) }; rcmdcheck::rcmdcheck(args = "--as-cran", error_on = "warning", env = c(callr::rcmd_safe_env(), "_R_CHECK_CRAN_INCOMING_" = "false"))'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
