# GitLab CI for seor: fleet-ci's template, pinned by commit SHA (ADR 0012,
# fleet-ci README "The CI template"). The template owns the event table, the
# jobs and the images; this file sets only the package's switches and
# settings, and adds seor's x-* jobs. A push to main or a branch, and a merge
# request, create no pipeline: the merge gate is the local one
# (.fleet-ci/gate, run by the .fleet-ci/pre-push hook; settings in
# .fleet-ci.yml). T2 runs on the deep-check schedule (SCHEDULE_KIND=deep-check,
# schedule 4467484), T3 on a RELEASE=1 web pipeline and a v* tag. The
# dependency-audit schedule (4467483) gets no pipeline: osv-audit and
# security-audit run in T2. design/ci.md says what moved where, and the gaps
# the migration accepted.
#
# Bump the pin by changing `ref:` and re-running fleet-ci's bin/vendor at the
# same SHA, in one merge request: .fleet-ci/VERSION must equal `ref:`.
include:
  - project: bart-turczynski/fleet-ci
    ref: 162f35db568426a44d796593c1c25955a9b2add3
    file: templates/r-package.yml

variables:
  # seor is a metapackage whose members sitemapr, robotstxtr and ssrfr are
  # not yet on CRAN, so `--as-cran`'s CRAN incoming feasibility step always
  # reports an ERROR: non-mainstream strong dependencies, the `Remotes:`
  # field, and the archived `seoR` name clash. That is a true and permanent
  # statement until the members are published, so t2-ascran runs with
  # incoming off: seor's named exception (ADR 0004, carried forward by ADR
  # 0012). Every other `--as-cran` check still runs. Turn it back on with the
  # first CRAN submission, when `Remotes:` is dropped
  # (design/release-deltas.md, step 5).
  FLEET_INCOMING: "false"
  # seor has no compiled code (no src/), which the sanitizer leg exists for;
  # the former CI had no sanitizer job either.
  FLEET_SANITIZERS: "false"
  # The template's t2-floor installs every dependency from one dated
  # snapshot, and seor's floor closure cannot come from one: sitemapr,
  # robotstxtr and ssrfr are not on CRAN, and punycoder and rurl need their
  # R 4.1 fixes from the r-universe. So the floor leg is x-floor, on
  # .t2-job, in its place: the former floor-check recipe.
  FLEET_FLOOR: "false"

# The deep-check leg at the declared R floor, `Depends: R (>= 4.1.0)`, in
# place of the template's t2-floor (FLEET_FLOOR above): the former
# floor-check job, its setup carried over from the former `.r` template.
#
# seor attaches every member, so its floor is the highest in the fleet
# (design/fleet-standard.md): pslr, punycoder, sitemapr, robotstxtr and ssrfr
# declare R 4.1. 4.1 is also the oldest minor with an arm64 rocker/r-ver
# image, which this project's runner needs.
#
# - Packages come from one dated Posit Package Manager snapshot,
#   FLOOR_SNAPSHOT, used in this job alone. seor's Imports are the members,
#   which reached CRAN in 2026 (pagerankr 0.1.0 on 2026-09-28), and raddr
#   needs rlang >= 1.1.7 and vctrs >= 0.7.0 (January 2026). 2026-09-30 is the
#   oldest date carrying all of them; every dependency there still declares
#   R 4.1 or older.
# - sitemapr, robotstxtr and ssrfr are not on CRAN, so they come from the
#   r-universe, after the CRAN members and their dependencies are in place.
# - ssrfr needs the R curl package >= 7.0.0, and every R curl since 7.0.0
#   wants libcurl >= 7.73; this focal image ships 7.68.0. curl's configure
#   then fetches a static libcurl (8.14.1) with the `curl` binary, which the
#   apt line installs; without it the build fails on
#   `CURLINFO_EFFECTIVE_METHOD undeclared`. That static libcurl meets ssrfr's
#   `SystemRequirements: libcurl (>= 7.73.0)`. The install step fails loudly
#   if the curl it got is older.
# - punycoder and rurl come from the r-universe too, first: their R 4.1 fixes
#   are on main but not yet on CRAN. CRAN punycoder 1.3.0 doesn't build on
#   Ubuntu 20.04's libidn2 2.2 (punycoder !68 added the >= 2.3.5 configure
#   check), and CRAN rurl 3.1.0 zero-pads IPv6 hex on R < 4.2 (rurl !164).
#   Back to the snapshot once both releases reach CRAN.
# - The apt line is the former `.r` template's, less pandoc and TeX (no
#   vignettes and no manual here), plus floor-check's own: on R 4.1 every
#   dependency builds from source, igraph among them (libglpk-dev, libgmp-dev,
#   libxml2-dev), and punycoder's configure looks for libidn2 with pkg-config.
# - Only what the check needs is installed: the members, the test Suggests and
#   rcmdcheck. oysteR and rosv serve the audits, whose tests skip without
#   them, so _R_CHECK_FORCE_SUGGESTS_=false lets --as-cran report them as a
#   NOTE instead of stopping.
# - Vignettes are neither built nor checked, and there is no manual, as in
#   punycoder: the vignette attaches the same members the tests do.
# - The check is --as-cran with CRAN incoming off (ADR 0004; and on a v* tag
#   the incoming check would also warn "Insufficient package version" and
#   block `pages`), error_on = "warning", and the template t2-floor's two
#   guards: a `Status:` line in 00check.log, then R CMD check's own exit
#   status, because rcmdcheck reads a check that halted partway as 0/0/0 and
#   returns normally (SEOR-maavnxdm). No library cache: each weekly run
#   installs the closure from source.
#
# BLOCKING, like every T2 leg: a scheduled detector that cannot go red is
# worthless. The former leg's first green run was pipeline 2909936469
# (2026-10-04, SEOR-kqcbgsfc).
x-floor:
  extends: .t2-job
  image: rocker/r-ver:4.1.3
  variables:
    FLOOR_SNAPSHOT: "https://packagemanager.posit.co/cran/2026-09-30"
    FLOOR_UNIVERSE: "https://bart-turczynski.r-universe.dev"
    R_CRAN_SRC: "https://cloud.r-project.org"
    R_CRAN_WEB: "https://cloud.r-project.org"
    _R_CHECK_FORCE_SUGGESTS_: "false"
    _R_CHECK_CRAN_INCOMING_: "false"
  script:
    - apt-get update -qq
    - >
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
      curl ca-certificates git qpdf pkg-config
      libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev zlib1g-dev
      libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev
      libpng-dev libtiff5-dev libjpeg-dev
      cmake libuv1-dev libglpk-dev libx11-dev
      libidn2-0-dev libgmp-dev libicu-dev
    - >
      Rscript -e 'snap <- Sys.getenv("FLOOR_SNAPSHOT"); univ <- Sys.getenv("FLOOR_UNIVERSE");
      install.packages(c("punycoder", "rurl"), repos = c(univ, snap), Ncpus = 4L);
      install.packages(c("pagerankr", "pslr", "raddr",
      "testthat", "knitr", "rmarkdown", "rcmdcheck"),
      repos = snap, Ncpus = 4L);
      install.packages(c("sitemapr", "robotstxtr", "ssrfr"), repos = c(univ, snap), Ncpus = 4L);
      stopifnot(packageVersion("curl") >= "7.0.0");
      need <- c("pagerankr", "pslr", "punycoder", "raddr", "robotstxtr", "rurl", "sitemapr", "ssrfr", "testthat", "rcmdcheck");
      ok <- vapply(need, requireNamespace, NA, quietly = TRUE);
      if (!all(ok)) stop("not available: ", paste(need[!ok], collapse = ", "));
      print(R.version.string); print(curl::curl_version()$version)'
    - >
      Rscript -e 'res <- rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran", "--ignore-vignettes"),
      build_args = c("--no-manual", "--no-build-vignettes"),
      error_on = "warning", check_dir = "check",
      env = c(callr::rcmd_safe_env(), "_R_CHECK_CRAN_INCOMING_" = "false"));
      log <- file.path(res$checkdir, "00check.log");
      if (!file.exists(log) || !any(grepl("^Status:", readLines(log, warn = FALSE)))) stop("R CMD check did not complete: ", log, " has no Status line", call. = FALSE);
      if (!identical(as.integer(res$status), 0L)) stop("R CMD check exited with status ", res$status, "; the run did not complete.", call. = FALSE)'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - check/

# FOSSA license and security scan (design/fleet-standard.md, "FOSSA": seor is
# one of the three FOSSA packages), on .t2-job as ADR 0012 says: `fossa
# analyze` runs on the weekly deep-check and in every release pipeline, not
# on every push to main, so the FOSSA project and the README's slot-17 badges
# are refreshed at most weekly and at each release. FOSSA_API_KEY is a masked
# CI/CD variable only the owner holds, so the job fails, rather than skipping
# green, when it is missing. The CLI comes from FOSSA's official install
# script, which ships linux/arm64 builds for this runner. The pipeline is a
# detached checkout, so the branch and revision are passed rather than
# inferred; a tag pipeline has no branch and reports main, the branch the
# released commit is on. ssrfr's x-fossa is the same job.
x-fossa:
  extends: .t2-job
  image: debian:trixie-slim
  script:
    - test -n "${FOSSA_API_KEY:-}" || { echo "FOSSA_API_KEY is not set on this project; fossa analyze cannot upload."; exit 1; }
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends curl ca-certificates git
    - >
      curl -fsSL -H 'Cache-Control: no-cache'
      https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | sh
    - fossa analyze --branch "${CI_COMMIT_BRANCH:-$CI_DEFAULT_BRANCH}" --revision "$CI_COMMIT_SHA"
