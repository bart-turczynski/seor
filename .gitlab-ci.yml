# CI for seor, an R package.
#
# This replaces eight GitHub Actions workflows. The differences are not
# cosmetic, because GitLab has no action ecosystem and therefore no
# `r-lib/actions`: setup-r, setup-pandoc, setup-tinytex and
# setup-r-dependencies all have to be done by hand here. What that costs, and
# what genuinely did not survive the move, is written up in docs/notes-r.md
# ("CI on GitLab") in the generator repo — read it before reshaping this file.
#
# The one structural change worth knowing up front: GitHub split lint, README
# sync, check and coverage into four jobs because `setup-r-dependencies` cached
# the package library across them almost for free. So the fast gate here is
# **one** job running the same chain the pre-push hook runs, and the jobs that
# are genuinely separate concerns are the ones that stayed separate.
#
# That consolidation was originally forced: until 2026-09-23 the runners had no
# cache backend configured, so the `cache:` block below silently did nothing
# across jobs and every job that needed R packages paid for its own full `pak`
# resolution. They now share an S3 cache, so a second job in the same pipeline
# starts warm — see design/adr/0003-fleet-ci-runs-on-self-hosted-runners.md.
# Keep the consolidation anyway: it is still fewer runner acquisitions, and the
# cache is an optimisation, not a guarantee (a DESCRIPTION change invalidates
# it and the next pipeline is cold again).

stages:
  - verify
  - check
  - pages
  - maintenance

default:
  interruptible: true

# --------------------------------------------------------------------------
# Shared R setup
#
# rocker/verse would carry R, pandoc and TeX in a single image, but it is
# published amd64-only — on an arm64 runner that means every R compile runs
# under QEMU. rocker/r-ver is multi-arch, so take that and add the toolchain by
# hand.
# --------------------------------------------------------------------------

.r:
  image: rocker/r-ver:4.5.1
  variables:
    # The image sets LANG, but CI runners hand jobs a controlled environment
    # that drops it, so R falls back to the C locale. Any UTF-8 byte in a file
    # R reads then comes back with "bytes" encoding, and lintr dies parsing its
    # own .lintr ("translating strings with bytes encoding is not allowed") on
    # nothing worse than an em-dash in a comment. GitHub's runners set
    # LANG=C.UTF-8 themselves, which is why this never surfaced there.
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    # R CMD check builds a PDF manual, and Rd2pdf defaults to
    # R_RD4PDF="times,inconsolata,hyper". On Debian inconsolata.sty ships in
    # texlive-fonts-extra (~1 GB, not installed below), so the manual step
    # fails with "LaTeX Error: File `inconsolata.sty' not found" — and the
    # verify chain runs rcmdcheck with error_on = "warning", so that one
    # warning fails the job. GitHub used r-lib/actions/setup-tinytex, which
    # fetches missing LaTeX packages on demand. Dropping inconsolata changes
    # only the manual's code font.
    R_RD4PDF: "times,hyper"
    # GitLab only caches paths under $CI_PROJECT_DIR, and R's user library
    # lives under $HOME — so move it here, then cache it. Without this every
    # job recompiles the full dependency closure from source.
    #
    # Setting this variable is NOT sufficient on its own, and was a silent
    # no-op until 2026-09-23. rocker/r-ver's Renviron.site puts
    # /usr/local/lib/R/site-library FIRST in .libPaths() and R_LIBS_USER
    # third, and R installs into the first writable entry — so every package
    # went into the image's site-library and died with the container, while
    # `.r-lib` was cached empty (1 entry, 0 MiB, measured). Overriding
    # R_LIBS_SITE does not help either: Renviron.site wins over the
    # environment. The .libPaths() line in before_script is what actually
    # moves the install target; do not remove it and leave this variable
    # looking like it does the job.
    R_LIBS_USER: "$CI_PROJECT_DIR/.r-lib"
    PKG_CACHE_DIR: "$CI_PROJECT_DIR/.pak-cache"
    # rocker/r-ver bakes a *frozen* p3m snapshot into Rprofile.site at image
    # build time: 4.5.1 pins 2025-10-30, 4.4.3 pins 2025-04-10. Three of
    # seor's members reached CRAN after both dates — rurl on 2026-06-19, pslr
    # and punycoder on 2026-07-19 — so pak resolves the package's own Imports
    # against a repository that cannot see them and dies with "Can't find
    # package called pslr, punycoder, rurl". Overriding the image's CRAN
    # environment variable does not help: rocker's setup_R.sh wrote the URL
    # into Rprofile.site as a literal, so it has to be replaced at run time
    # (see before_script). Pinned rather than "latest" so a rebuild of an old
    # commit resolves the same versions. Bumping it when a member publishes is
    # now an optimisation, not a fix: p3m lags CRAN at every coordinate, so the
    # CRAN fallback appended in before_script is what actually resolves a
    # freshly published member.
    P3M_SNAPSHOT: "2026-09-01"
  cache:
    # Keyed on DESCRIPTION: the dependency declaration. An R package has no
    # lockfile, so this is the closest thing to one.
    key:
      files:
        - DESCRIPTION
    paths:
      - .r-lib
      - .pak-cache
  before_script:
    - mkdir -p "$R_LIBS_USER" "$PKG_CACHE_DIR"
    # Point R at a snapshot new enough to carry the members (see
    # P3M_SNAPSHOT), then append CRAN itself BEHIND it.
    #
    # p3m stays FIRST so packages still arrive as prebuilt binaries — a cold
    # `check` otherwise compiles the whole Suggests set from source. CRAN is a
    # source-only fallback for the handful of packages p3m has not synced yet;
    # `available.packages()` unions the two and takes the highest version, so
    # on any day p3m is current this changes nothing.
    #
    # The fallback is not optional, and no value of P3M_SNAPSHOT substitutes
    # for it: p3m lags CRAN by more than a day for a new release, at *every*
    # coordinate. Measured 2026-09-10, ~38 h after rurl 3.0.1 was published:
    #
    #     p3m 2026-09-01                  rurl 1.2.0
    #     p3m __linux__/noble/2026-09-01  rurl 1.2.0   <- the path built below
    #     p3m latest                      rurl 1.2.0
    #     cloud.r-project.org             rurl 3.0.1
    #
    # seor resolves pagerankr from GitLab main (see Remotes: in DESCRIPTION),
    # and pagerankr now requires rurl (>= 3.0.1), so a p3m-only repo set cannot
    # solve seor's own dependency closure at all — every job here would die on
    # "Can't install dependency rurl (>= 3.0.1)" (SEOR-arofvftg). pagerankr hit
    # this first and fixed it the same way (cfdef3c).
    #
    # Appended rather than rewritten, so the HTTPUserAgent line rocker sets —
    # the one that makes p3m serve binaries instead of source — survives, and
    # the later options() call wins. p3m's binary path is per-distribution and
    # amd64-only, so on arm64 fall back to the source repository, exactly as
    # rocker's own build does.
    - |
      . /etc/os-release
      repo="https://p3m.dev/cran/__linux__/${UBUNTU_CODENAME}/${P3M_SNAPSHOT}"
      if [ "$(uname -m)" = "aarch64" ]; then
        repo="https://p3m.dev/cran/${P3M_SNAPSHOT}"
      fi
      echo "options(repos = c(P3M = '${repo}', CRAN = 'https://cloud.r-project.org'))" \
        >> "${R_HOME}/etc/Rprofile.site"
      # Put the cached library FIRST so installs land in it (see R_LIBS_USER
      # above). Appended to Rprofile.site rather than set as an environment
      # variable because Renviron.site is read later and overrides the
      # environment. site-library stays on the path behind it, so the image's
      # own packages (docopt, littler) remain visible.
      echo '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))' \
        >> "${R_HOME}/etc/Rprofile.site"
      Rscript -e 'cat("Effective repos:\n"); print(getOption("repos"))' \
        -e 'cat("Library paths:\n"); print(.libPaths())'
    - apt-get update -qq
    # rocker/r-ver is a lean image. git is needed because pak and covr shell
    # out to it; the LaTeX set and qpdf are what `R CMD check --as-cran` needs
    # to build and size-check the PDF manual; the -dev headers are the price of
    # source-compiling on a runner Posit Package Manager serves no binaries
    # for. On an amd64 runner most of the headers go unused, but installing
    # them is harmless and keeps one config for both architectures.
    #
    # The last line is devtools' own closure rather than seor's: igraph needs
    # libglpk-dev, fs needs cmake and libuv1-dev, clipr needs libx11-dev. pak
    # flagged all four as unsatisfied system requirements in the `readme` job
    # (SEOR-htoikrfd). Only that job installs devtools, but the apt list is
    # shared, so they go here.
    - >
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
      curl ca-certificates git
      pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-recommended qpdf
      libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev zlib1g-dev
      libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev
      libpng-dev libtiff5-dev libjpeg-dev
      cmake libuv1-dev libglpk-dev libx11-dev
    - Rscript -e 'if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak", repos = "https://cloud.r-project.org")'

# --------------------------------------------------------------------------
# workflow — keep only the pipeline on main
#
# Before this rule, one unit could fire up to three pipelines: a branch
# pipeline, a merge-request pipeline, and the push-to-main pipeline that
# actually gates the work. On the fleet's self-hosted runners — a small fixed
# number of slots shared across every repo on one Mac, `concurrent` in
# ~/.gitlab-runner/config.toml — the first two are created FIRST and hold a
# slot while main's
# pipeline sits pending behind them — measured repeatedly on 2026-09-22
# (SEOR-bmgkzhvy): the branch pipeline is guaranteed waste, because the slice
# flow deletes the branch at merge, so by the time the runner reaches it the
# ref is gone and it dies at get_sources (exit 128, ~12s, all jobs red for no
# reason); the MR pipeline can outlive its own merge and sit RUNNING or
# PENDING against a tree nobody can act on anymore, once blocking the runner
# for 36 minutes across three projects at once. An earlier, narrower version
# of this rule — suppress only the branch pipeline, standard GitLab
# duplicate-pipeline guard — was tried first and found insufficient: it does
# nothing about an already-merged MR's pipeline, which is what caused that
# stall. This is the superseding, final decision: suppress both.
#
# Cost, stated plainly: a feature-branch push gets no CI pipeline at all —
# that is the intent, not an oversight. An API-triggered pipeline on a
# non-default branch gets nothing either, for the same reason. A *web*-
# triggered one does run, and that is the deliberate exception: see the rule
# below. This costs nothing in practice on this fleet:
# `only_allow_merge_if_pipeline_succeeds` is false on every project here
# (true only on raddr, until that was also flipped false — see
# RADD-dyqdamzt), so a CI result has never gated a merge. What does gate a
# merge is `main` being a protected branch (Maintainer-only push/merge,
# force-push refused) on every project, and the pre-push `verify` hook below,
# which runs the same chain before the branch is ever pushed.
# --------------------------------------------------------------------------
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # The escape hatch. `web` means a human opened Build > Pipelines > Run
    # pipeline and chose a ref, so this can never fire on its own and cannot
    # reintroduce the three-pipelines-per-merge problem above, which was
    # entirely push- and merge-request-driven. What it buys back is running
    # the gate against a feature branch BEFORE it merges (SEOR-bmgkzhvy).
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

# Every pipeline that reaches a job carries a tag, a push to main, or a
# hand-started `web` run (the workflow: rules above filter everything else out
# before any job-level rule is evaluated) — so the merge-request and api
# branches this template used to carry can never match and have been dropped
# rather than left as dead config. The `web` branch is NOT dead: without it
# the escape hatch would open a pipeline in which the fast gate is the one
# thing that cannot run, which is the whole reason to hand-start one. Kept as
# a named template, extended by five jobs, rather than inlined identically
# five times.
.on-main:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

.scheduled-or-manual:
  rules:
    # A scheduled run is BLOCKING. These jobs are drift and vulnerability
    # detectors; `allow_failure: true` here made a scheduled pipeline report
    # success even when the detector fired, which is the one outcome that makes
    # them worthless. They are independent jobs, so a red leg neither stops its
    # siblings nor hides their results.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Under `rules`, `when: manual` defaults to `allow_failure: false` (unlike a
    # job-level `when: manual`), which would leave a hand-triggered pipeline
    # sitting *blocked* on a job nobody meant to gate on. This line is
    # load-bearing, not a leftover of the one dropped above.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

# --------------------------------------------------------------------------
# verify — the fast gate, on every push to main (see workflow: above — no
# merge-request or branch pipeline runs, so this is the only pipeline a
# change gets)
# --------------------------------------------------------------------------

# lintr::lint_package() plus `R CMD check --as-cran`, which is the same chain
# `.pre-commit-config.yaml` runs on push and the same one TEMPLATE_CONFIGS
# declares — the verify placeholder below is substituted from it, so CI and the
# local gate cannot drift apart.
#
# The dev-tooling line is NOT redundant with the install step below it. That
# one installs only the package's own DESCRIPTION dependencies; lintr,
# rcmdcheck and styler are deliberately not declared there, because they are
# development tooling rather than package dependencies. Without the extra line
# the job reaches the verify chain with no linter installed and dies on
# "there is no package called 'lintr'".
# seor is a metapackage whose members `pagerankr`, `sitemapr` and `robotstxtr`
# are not yet on CRAN, so `--as-cran`'s "CRAN incoming feasibility" step always
# reports an ERROR: non-mainstream strong dependencies, the `Remotes:` field, and
# the archived `seoR` name clash. That is a true statement about CRAN readiness
# and a permanent one until the members are published, so running it as a
# per-push gate encodes a known failure rather than catching a regression. The
# step is disabled here and only here; every other `--as-cran` check still runs.
# Re-enable it as part of the first CRAN submission, when `Remotes:` is dropped.
verify:
  extends:
    - .r
    - .on-main
  stage: verify
  script:
    - Rscript -e 'pak::pak(c("any::lintr", "any::rcmdcheck", "any::styler"))'
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE)'
    - Rscript -e 'lints <- lintr::lint_package(); if (length(lints)) { print(lints); quit(status = 1) }' && Rscript -e 'rcmdcheck::rcmdcheck(args = "--as-cran", error_on = "warning", env = c(callr::rcmd_safe_env(), "_R_CHECK_CRAN_INCOMING_" = "false"))'

# Lightweight guard against NEWS/DESCRIPTION version drift: the top NEWS.md
# heading must be either "(development version)" or exactly the DESCRIPTION
# Version, which catches a stale heading left in at release. Pure shell, so it
# does not need the R image and runs in seconds.
news-version:
  extends: .on-main
  stage: verify
  image: alpine:3
  before_script:
    - apk add --no-cache grep sed
  script:
    - |
      set -eu
      version="$(grep -E '^Version:' DESCRIPTION | head -n1 | sed -E 's/^Version:[[:space:]]*//')"
      # First top-level NEWS heading, e.g. "# seor 1.0.0" or
      # "# seor (development version)". Strip the name prefix.
      heading="$(grep -m1 -E '^# ' NEWS.md | sed -E 's/^#[[:space:]]+(seor[[:space:]]+)?//')"
      echo "DESCRIPTION Version : '$version'"
      echo "Top NEWS heading    : '$heading'"
      if [ "$heading" = "(development version)" ] || [ "$heading" = "$version" ]; then
        echo "OK: NEWS heading and version are consistent."
      else
        echo "Top NEWS.md heading ('$heading') is neither '(development version)' nor the DESCRIPTION Version ('$version'). Update NEWS.md before release."
        exit 1
      fi

# CITATION.cff and .zenodo.json each duplicate the version and the project URLs
# out of DESCRIPTION. Measured 2026-09-11, four of the seven repositories in
# this fleet carrying those files disagreed with their own DESCRIPTION and one
# disagreed with itself (SEOR-lreejxat); seor's two still named a Pages address
# that returns 403. The rule is
# design/adr/0001-citation-metadata-names-the-release.md. Offline, stdlib-only
# Python, so it runs in seconds without the R image - same shape as
# news-version above.
citation-version:
  extends: .on-main
  stage: verify
  image: python:3.13-alpine
  script:
    - python3 scripts/check-citation.py --self-test
    - python3 scripts/check-citation.py

# README.md is knit from README.Rmd, so a hand-edit to the markdown is silently
# lost on the next render. devtools::build_readme() installs the package and
# re-renders; any diff means the committed README is stale.
readme:
  extends:
    - .r
    - .on-main
  stage: verify
  script:
    # Deliberately NOT `pak::pak(c("any::devtools", "local::."))`. Handing
    # `local::.` to pak makes it build seor's source tarball as part of solving
    # the plan, and pak builds every source package before installing any of
    # them -- so the tarball build runs while the members are still absent from
    # the job library. seor declares `VignetteBuilder: knitr` and its vignette
    # attaches the package, so vignette evaluation fails and takes the build
    # with it. pak reports that as `Failed to download seor` with no underlying
    # reason, because "download" is its term for producing a local package's
    # tarball (SEOR-htoikrfd).
    #
    # So mirror the shape that already works in `verify`: resolve the
    # package's own dependencies first, add devtools separately, and let
    # build_readme() handle installing seor itself.
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE)'
    - Rscript -e 'pak::pak("any::devtools")'
    - Rscript -e 'devtools::build_readme()'
    - |
      if ! git diff --exit-code -- README.md; then
        echo "README.md is out of sync with README.Rmd. Run devtools::build_readme() and commit the result."
        exit 1
      fi

# --------------------------------------------------------------------------
# check — the slower passes
# --------------------------------------------------------------------------

# Coverage, reported through GitLab natively rather than through Codecov: the
# `coverage:` regex drives the badge and the MR widget, and the cobertura
# artifact drives per-line annotations in the diff. Neither needs an account or
# a token, which is what the GitHub-era codecov-action job needed before it
# stopped no-opping. See design/badges.md if you want Codecov as well.
coverage:
  extends:
    - .r
    - .on-main
  stage: check
  script:
    # covr::package_coverage() installs the package to measure it, so seor's
    # own Imports have to be present first -- five of them (pagerankr, pslr,
    # punycoder, rurl, sitemapr), three of which resolve through `Remotes:`
    # rather than CRAN. Installing only covr and xml2 left the job dying on
    # "dependencies are not available for package 'seor'". Same omission the
    # readme job had, in a different shape (SEOR-htoikrfd).
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE)'
    - Rscript -e 'pak::pak(c("any::covr", "any::xml2"))'
    - Rscript -e 'cov <- covr::package_coverage(quiet = FALSE); print(cov); covr::to_cobertura(cov)'
  coverage: '/Coverage:\s*(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

# The cross-platform matrix, reduced to what GitLab.com actually offers for
# free. GitHub ran macOS, Windows and Ubuntu on R devel/release/oldrel-1;
# GitLab.com's macOS and Windows runners are paid tiers, and there is no
# `r-version: devel` equivalent to point an image at. So this keeps the R
# version axis on Linux and the rest moves to R-hub before a CRAN submission —
# `rhub::rc_submit()` runs on R-hub's own infrastructure and needs no forge
# account at all. docs/notes-r.md records that trade.
full-check:
  extends:
    - .r
    - .scheduled-or-manual
  stage: check
  image: rocker/r-ver:$R_VERSION
  parallel:
    matrix:
      - R_VERSION: ["4.5.1", "4.4.3"]
  script:
    - Rscript -e 'pak::pak(c("any::lintr", "any::rcmdcheck", "any::styler"))'
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE)'
    - Rscript -e 'lints <- lintr::lint_package(); if (length(lints)) { print(lints); quit(status = 1) }' && Rscript -e 'rcmdcheck::rcmdcheck(args = "--as-cran", error_on = "warning", env = c(callr::rcmd_safe_env(), "_R_CHECK_CRAN_INCOMING_" = "false"))'

# --------------------------------------------------------------------------
# pages — the pkgdown site
#
# GitHub deployed through actions/upload-pages-artifact + deploy-pages. GitLab
# Pages is convention over configuration instead: a job named exactly `pages`
# that leaves its output in `public/` is published, and nothing else is. The
# site URL is https://bart-turczynski.gitlab.io/seor/ for a user or
# top-level group; a project inside a subgroup gets the subgroup path appended.
# Keep that URL in step with `url:` in _pkgdown.yml.
#
# _pkgdown.yml builds into site/, not public/, because docs/ holds durable
# project documentation and must not be replaced by generated HTML — so the
# job renames at the end rather than reconfiguring pkgdown.
# --------------------------------------------------------------------------

pages:
  extends: .r
  stage: pages
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Deliberately pinned to the default branch, unlike every other job here.
    # `pages` does not report on a tree, it PUBLISHES one to a live URL, so a
    # hand-started pipeline on a feature branch must not reach it — the site
    # would then serve unmerged code with nothing on the page saying so. The
    # escape hatch added to `workflow:` is for verifying a branch, not for
    # deploying one (SEOR-bmgkzhvy).
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    # Not `pak::pak(c("any::pkgdown", "local::."))`. Handing `local::.` to pak
    # makes it build seor's source tarball while solving, which runs
    # `R CMD build` — and that re-renders vignettes/introduction.Rmd, whose
    # first chunk is `library(seor)`. The members are not installed yet at that
    # point, so the render dies and pak reports it as "Failed to download seor".
    # This repo has fixed the same pattern twice already: `readme`
    # (SEOR-htoikrfd) and `coverage` (e903ba1). SEOR-fijlyqch.
    #
    # `pages` cannot simply drop the package the way those two did, though:
    # build_site(install = FALSE) does NOT load the source tree, it expects the
    # package to be installed already, and the article build attaches it. So
    # install the dependency closure first, then install seor itself with
    # `R CMD INSTALL`, which does NOT run `R CMD build`. Measured on this
    # package: it logs "installing vignettes" but renders nothing and leaves no
    # doc/ behind, so `library(seor)` is never evaluated during the install and
    # the ordering problem pak hit cannot arise. pkgdown re-renders the article
    # from vignettes/ itself, afterwards, with the package already loadable.
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE)'
    - Rscript -e 'pak::pak("any::pkgdown")'
    - R CMD INSTALL --no-multiarch --with-keep.source .
    # pkgdown renders EVERY top-level .md into the site, so the agent
    # instruction files were being published as AGENTS.html, CLAUDE.html and
    # friends next to the reference -- internal working notes served as if
    # they were user documentation, and indexable (SEOR-pibdjanz).
    #
    # Globbed on purpose, not spelled out file by file. The leak reached
    # four repos AFTER being fixed in one, because the exact names differ
    # per repo and the explicit list was copied rather than re-derived.
    # These three patterns cover every agent file in the fleet today and a
    # future AGENTS_SOMETHING.md or FP_WHATEVER.md without a second round
    # of this. `rm -f` so a pattern that matches nothing is a no-op: the
    # set of files present differs per repo, and some are gitignored and
    # never reach the runner at all.
    - 'rm -f AGENTS*.md CLAUDE*.md FP_*.md'
    - Rscript -e 'pkgdown::build_site(new_process = FALSE, install = FALSE)'
    - rm -rf public && mv site public
  artifacts:
    paths:
      - public

# --------------------------------------------------------------------------
# maintenance — audits and metadata, scheduled or on demand
#
# GitLab keeps pipeline schedules in project settings (CI/CD > Schedules), not
# in this file, so the weekly cadence the GitHub workflows declared with `cron:`
# is gone until you add a schedule there. Nothing below runs on a merge
# request, and nothing below can turn one red.
# --------------------------------------------------------------------------

# Dependency vulnerability audit against the OSV database (https://osv.dev) via
# {rosv}. Needs no account, token or CI/CD variable, and has first-class CRAN
# coverage. Runs tests/testthat/test-osv.R against the package's runtime
# dependency closure at installed versions.
osv-audit:
  extends:
    - .r
    - .scheduled-or-manual
  stage: maintenance
  variables:
    # Belt and braces so skip_on_cran() in test-osv.R cannot skip the audit
    # silently. Measured 2026-09-11 on testthat 3.3.2, `test_local()` does set
    # NOT_CRAN=true itself -- the older comment here claimed it does not, which
    # is wrong and mattered, because the same claim is what makes the pre-push
    # rcmdcheck run look like it audits when it does not (see the header of
    # tests/testthat/test-security.R). Kept explicit anyway: it costs nothing
    # and does not depend on a testthat implementation detail.
    NOT_CRAN: "true"
  script:
    # `local::.` removed for the reason in the `pages` job above
    # (SEOR-fijlyqch). testthat::test_local() loads the package with pkgload,
    # so seor itself never needs installing here — only its closure, which is
    # what the audit measures.
    - Rscript -e 'pak::pak(c("any::rosv", "any::testthat"))'
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE)'
    - Rscript -e 'testthat::test_local(filter = "osv", stop_on_failure = TRUE)'

# Dependency vulnerability audit against the Sonatype OSS Index via {oysteR}.
# OSS Index requires authentication (anonymous requests get HTTP 401), so this
# job needs two CI/CD variables:
#   OSSINDEX_USER   - OSS Index account email (https://ossindex.sonatype.org)
#   OSSINDEX_TOKEN  - OSS Index API token
#
# THIS JOB FAILS WHEN THEY ARE ABSENT, ON PURPOSE. It used to skip cleanly and
# stay green, which is the failure `PUNY-rsxtbbln` records in punycoder and
# `SEOR-fkvlzltx` names as defect 3: measured 2026-09-11, this project carries
# zero CI/CD variables, so every run of this job reported success having
# audited nothing. A job that answers "no vulnerabilities" when it never asked
# is worse than no job. OSSINDEX_AUDIT_REQUIRED turns each missing
# precondition in tests/testthat/test-security.R into a loud failure instead of
# a skip; it is set here and nowhere else, so local runs, the pre-push gate and
# `R CMD check` still skip.
#
# OWNER GATE -- the variables cannot be set from a merge request. Run, once:
#
#   glab variable set OSSINDEX_TOKEN '<api token>' \
#     --masked --repo bart-turczynski/seor
#   glab variable set OSSINDEX_USER '<account email>' \
#     --repo bart-turczynski/seor
#
# OSSINDEX_USER is deliberately not `--masked`: GitLab rejects masking for a
# value containing `@`, and the account email is not the secret. Until both
# exist, a scheduled run of this job is red and says exactly why.
#
# Also outstanding, and also an owner gate: this project has no pipeline
# schedules at all (measured 2026-09-11, `pipeline_schedules` returns `[]`), so
# neither this job nor `osv-audit` has ever run unattended. Add one under
# Settings > CI/CD > Schedules.
security-audit:
  extends:
    - .r
    - .scheduled-or-manual
  stage: maintenance
  variables:
    NOT_CRAN: "true"
    OSSINDEX_AUDIT_REQUIRED: "true"
  script:
    # Same swap as osv-audit; see the `pages` job for why (SEOR-fijlyqch).
    - Rscript -e 'pak::pak(c("any::oysteR", "any::testthat"))'
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE)'
    - Rscript -e 'testthat::test_local(filter = "security", stop_on_failure = TRUE)'

# Regenerates codemeta.json (the CodeMeta / schema.org description of the
# package) from DESCRIPTION + inst/CITATION and commits it back, so the
# committed file stays a faithful mirror without manual upkeep.
#
# The push is the hard part. GitHub handed the workflow a GITHUB_TOKEN that
# could write to the repo; CI_JOB_TOKEN cannot push. This needs a project
# access token with `write_repository` scope exposed as a masked CI/CD variable
# named CODEMETA_TOKEN, which is why the job is manual/scheduled and
# non-blocking rather than running on every DESCRIPTION change.
codemeta:
  extends:
    - .r
    - .scheduled-or-manual
  stage: maintenance
  script:
    - Rscript -e 'pak::pak("any::codemetar")'
    - Rscript -e 'codemetar::write_codemeta(".")'
    - |
      if [ -z "$(git status --porcelain codemeta.json)" ]; then
        echo "codemeta.json unchanged."
        exit 0
      fi
      if [ -z "${CODEMETA_TOKEN:-}" ]; then
        echo "codemeta.json changed but CODEMETA_TOKEN is not set; not pushing."
        git --no-pager diff -- codemeta.json
        exit 1
      fi
      git config user.name "gitlab-ci"
      git config user.email "gitlab-ci@$CI_SERVER_HOST"
      git add codemeta.json
      git commit -m "chore: refresh codemeta.json [skip ci]"
      git push "https://codemeta:${CODEMETA_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"

# renovate — replaces Dependabot, which is GitHub-only. Needs a RENOVATE_TOKEN
# CI/CD variable (a project access token with `api` and `write_repository`
# scope). What it bumps is configured in renovate.json — for an R package that
# is the CI images and nothing else, since CRAN dependencies are declared as
# version floors in DESCRIPTION and resolved against current CRAN at install
# time, so there is no pin to bump.
renovate:
  extends: .scheduled-or-manual
  stage: maintenance
  image: renovate/renovate:41
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    LOG_LEVEL: info
  script:
    # Skip loudly rather than fail when the token is missing: a fresh project has
    # no RENOVATE_TOKEN by construction, and a red scheduled pipeline for a setup
    # step nobody has done yet is noise. Every *other* renovate failure — bad
    # config, API error, auth rejected — now fails the pipeline, which is the
    # point of dropping `allow_failure` above.
    - |
      if [ -z "$RENOVATE_TOKEN" ]; then
        echo "RENOVATE_TOKEN is not set - skipping renovate."
        echo "Add it under Settings > CI/CD > Variables: a project access token"
        echo "with 'api' and 'write_repository' scope."
        exit 0
      fi
    - renovate
